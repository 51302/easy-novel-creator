<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Novel Creator - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <!-- 左侧品牌区 -->
    <div class="login-brand">
        <div class="login-brand-icon creative-flow-icon">
            <div class="flow-ring flow-ring-1"></div>
            <div class="flow-ring flow-ring-2"></div>
            <div class="flow-ring flow-ring-3"></div>
            <div class="flow-center">✦</div>
        </div>
        <h1>AI Novel Creator</h1>
        <p>智能AI小说创作平台，让创意无限延伸，助您轻松创作精彩小说。</p>
    </div>

    <!-- 右侧登录面板 -->
    <div class="login-panel">
        <div class="login-card" id="loginCard">
            <div class="login-card-header">
                <h2>欢迎回来</h2>
                <span>请输入您的账号信息登录系统</span>
            </div>

            <form id="loginForm" novalidate>
                <!-- 用户名 -->
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="请输入用户名"
                            autocomplete="username"
                            required
                            minlength="2"
                            maxlength="50"
                        >
                    </div>
                </div>

                <!-- 密码 -->
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required
                            minlength="6"
                        >
                    </div>
                </div>

                <!-- 记住我 / 忘记密码 -->
                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot" id="forgotPassword">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span id="loginBtnText">登 录</span>
                    <span class="spinner hidden" id="loginSpinner"></span>
                </button>
            </form>

            <!-- 注册链接 -->
            <div class="login-card-footer">
                还没有账号？<a href="#" id="goRegister">立即注册</a>
            </div>
        </div>

        <!-- 注册卡片（默认隐藏） -->
        <div class="login-card hidden" id="registerCard">
            <div class="login-card-header">
                <h2>创建账号</h2>
                <span>注册一个新账号以使用系统</span>
            </div>

            <form id="registerForm" novalidate>
                <!-- 用户名 -->
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="regUsername"
                            name="regUsername"
                            placeholder="请输入用户名（字母数字下划线）"
                            autocomplete="username"
                            required
                            minlength="2"
                            maxlength="50"
                            pattern="[a-zA-Z0-9_]+"
                        >
                    </div>
                </div>

                <!-- 邮箱 -->
                <div class="form-group">
                    <label for="regEmail">邮箱</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input
                            type="email"
                            id="regEmail"
                            name="regEmail"
                            placeholder="请输入邮箱（可选）"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- 手机号 -->
                <div class="form-group">
                    <label for="regPhone">手机号</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                            <line x1="12" y1="18" x2="12.01" y2="18"></line>
                        </svg>
                        <input
                            type="text"
                            id="regPhone"
                            name="regPhone"
                            placeholder="请输入手机号（可选）"
                            autocomplete="tel"
                        >
                    </div>
                </div>

                <!-- 密码 -->
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="regPassword"
                            name="regPassword"
                            placeholder="请输入密码（至少6位）"
                            autocomplete="new-password"
                            required
                            minlength="6"
                        >
                    </div>
                </div>

                <!-- 确认密码 -->
                <div class="form-group">
                    <label for="regPasswordConfirm">确认密码</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="regPasswordConfirm"
                            name="regPasswordConfirm"
                            placeholder="请再次输入密码"
                            autocomplete="new-password"
                            required
                            minlength="6"
                        >
                    </div>
                </div>

                <!-- 注册按钮 -->
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span id="registerBtnText">注 册</span>
                    <span class="spinner hidden" id="registerSpinner"></span>
                </button>
            </form>

            <!-- 返回登录 -->
            <div class="login-card-footer">
                已有账号？<a href="#" id="goLogin">返回登录</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
