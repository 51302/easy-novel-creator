<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System - 仪表盘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard">

    <!-- ==================== 顶部导航栏 ==================== -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Auth System</h1>
        </div>

        <div class="navbar-actions">
            <div class="navbar-user">
                <div class="avatar" id="avatarInitial">A</div>
                <div class="user-info">
                    <span class="user-name" id="displayName">admin</span>
                    <span class="user-role" id="displayRole">管理员</span>
                </div>
            </div>
            <div class="navbar-divider"></div>
            <button class="btn-logout" id="btnLogout" title="退出登录">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                退出
            </button>
        </div>
    </nav>

    <!-- ==================== 左侧边栏 ==================== -->
    <aside class="sidebar">
        <!-- 主导航 -->
        <div class="sidebar-section">
            <div class="sidebar-section-title">主菜单</div>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a class="sidebar-nav-link active" data-page="dashboard" onclick="switchPage('dashboard')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        仪表盘
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a class="sidebar-nav-link" data-page="users" onclick="switchPage('users')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        用户管理
                    </a>
                </li>
            </ul>
        </div>

        <!-- 系统 -->
        <div class="sidebar-section">
            <div class="sidebar-section-title">系统</div>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a class="sidebar-nav-link" data-page="settings" onclick="switchPage('settings')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        系统设置
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <!-- ==================== 主内容区 ==================== -->
    <main class="main-content">

        <!-- ========== 仪表盘页面 ========== -->
        <section id="page-dashboard">
            <div class="page-header">
                <h2>仪表盘</h2>
                <p>系统运行概览与关键指标</p>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">用户总数</span>
                        <div class="stat-card-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="statTotal">-</div>
                    <div class="stat-card-change">系统注册用户总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">活跃用户</span>
                        <div class="stat-card-icon green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="statActive">-</div>
                    <div class="stat-card-change">状态正常的用户数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">管理员</span>
                        <div class="stat-card-icon orange">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="statAdmin">-</div>
                    <div class="stat-card-change">超级管理员数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-label">禁用用户</span>
                        <div class="stat-card-icon red">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                        </div>
                    </div>
                    <div class="stat-card-value" id="statDisabled">-</div>
                    <div class="stat-card-change">已禁用的用户数</div>
                </div>
            </div>

            <!-- 最近用户 -->
            <div class="content-card">
                <div class="content-card-header">
                    <h3>最近注册用户</h3>
                    <button class="btn btn-outline btn-sm" onclick="switchPage('users')">查看全部</button>
                </div>
                <div class="content-card-body">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>角色</th>
                                    <th>状态</th>
                                    <th>注册时间</th>
                                </tr>
                            </thead>
                            <tbody id="recentUsersTable">
                                <tr class="loading-row"><td colspan="6">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- ========== 用户管理页面 ========== -->
        <section id="page-users" class="hidden">
            <div class="page-header">
                <h2>用户管理</h2>
                <p>管理系统中的所有用户账号</p>
            </div>

            <div class="content-card">
                <div class="content-card-header">
                    <h3>用户列表</h3>
                    <button class="btn btn-primary btn-sm" id="btnAddUser">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        新增用户
                    </button>
                </div>
                <div class="content-card-body">
                    <!-- 工具栏 -->
                    <div class="toolbar">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="searchUser" placeholder="搜索用户名..." oninput="loadUsers()">
                        </div>
                        <select id="filterStatus" onchange="loadUsers()" class="btn-outline" style="padding: 0 12px; height: 40px; border-radius: var(--radius-sm);">
                            <option value="">全部状态</option>
                            <option value="1">正常</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>

                    <!-- 用户表格 -->
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>手机号</th>
                                    <th>角色</th>
                                    <th>状态</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable">
                                <tr class="loading-row"><td colspan="8">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 分页 -->
                    <div class="pagination">
                        <div class="pagination-info" id="paginationInfo">共 0 条记录</div>
                        <div class="pagination-btns" id="paginationBtns"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ========== 系统设置页面 ========== -->
        <section id="page-settings" class="hidden">
            <div class="page-header">
                <h2>系统设置</h2>
                <p>修改密码与个人设置</p>
            </div>

            <div class="content-card" style="max-width: 500px;">
                <div class="content-card-header">
                    <h3>修改密码</h3>
                </div>
                <div class="content-card-body">
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="oldPwd">旧密码</label>
                            <input type="password" id="oldPwd" placeholder="请输入旧密码" required minlength="6" style="padding-left: 16px;">
                        </div>
                        <div class="form-group">
                            <label for="newPwd">新密码</label>
                            <input type="password" id="newPwd" placeholder="请输入新密码" required minlength="6" style="padding-left: 16px;">
                        </div>
                        <div class="form-group">
                            <label for="confirmPwd">确认新密码</label>
                            <input type="password" id="confirmPwd" placeholder="请再次输入新密码" required minlength="6" style="padding-left: 16px;">
                        </div>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
