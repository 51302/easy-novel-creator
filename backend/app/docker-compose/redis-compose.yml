version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-novel
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=novel123redis
    command: redis-server --requirepass novel123redis --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
